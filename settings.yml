  # END GENERATED profile_link_fields default
  description: "Each Field Mapping names one Custom User Field, exactly as it appears in /admin/config/user_fields, and nests the Mappings that turn its values into Profile Links. A Mapping's value must exactly match the user's field value. WARNING: editing this setting here overrides it for this site, and an overridden setting never receives a shipped default again — this site's catalogue would freeze at the moment you save, silently and permanently, while the component carried on updating everywhere else. Change the product catalogue in the component's repository instead."
  schema:
    name: field
    identifier: user_field_name
    properties:
      user_field_name:
        type: string
        required: true
      mappings:
        type: objects
        schema:
          name: mapping
          identifier: value
          properties:
            value:
              type: string
              required: true
            url:
              type: string
              required: true
              validations:
                url: true

profile_link_debug_mode:
  type: bool
  default: false
  description: "Logs field values that matched no Mapping to the browser console. Configuration problems are always reported, regardless of this setting."
