# Runs the same gates CI would, before a commit exists rather than after.
# Install once per clone: `pre-commit install`.
#
# The local hooks below shell out to `pnpm`, so it has to be on PATH or they
# fail — and a hook that fails to start is indistinguishable from one that has
# nothing to check. Node 25 dropped corepack, so on a current Node there is no
# pnpm unless it was installed deliberately: `brew install pnpm`, or
# `npm i -g pnpm@10.28.0` to match the pinned packageManager.
#
# The whole suite takes a couple of seconds — the type-check is incremental and
# the unit tests never touch a network — so everything runs on every commit
# rather than being split into a fast and a slow tier.

minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The three fixers below rewrite the files they inspect, so they stay away
      # from data/. The Sheet Exports there are committed as verbatim
      # provenance: whatever the spreadsheet returned is what the diff should
      # show. A hook that strips a trailing space or normalises a line ending
      # makes the committed export disagree with its source — and since a
      # Catalogue Refresh writes the file back exactly as fetched, the hook and
      # the refresh would then undo each other on every commit.
      - id: trailing-whitespace
        exclude: ^data/
      - id: end-of-file-fixer
        exclude: ^data/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^data/
      - id: check-yaml # settings.yml decides whether the component installs
      - id: check-json # about.json likewise
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: local
    hooks:
      # Deliberately no `--cache`, unlike the `lint:js` script. A cached run
      # reported this branch clean while it held nineteen errors; a hook that
      # can do that is worse than no hook.
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --no-error-on-unmatched-pattern
        language: system
        files: ^(javascripts|migrations|scripts|data|test|spec)/.*\.(js|gjs|mjs|cjs|ts|gts|mts|cts)$

      - id: prettier
        name: prettier
        entry: pnpm exec prettier --check --no-error-on-unmatched-pattern
        language: system
        files: ^((javascripts|migrations|scripts|data|test|spec)/.*\.(js|gjs|ts|gts|mts|cts)|(javascripts|desktop|mobile|common|scss|stylesheets)/.*\.scss)$

      - id: stylelint
        name: stylelint
        entry: pnpm exec stylelint --allow-empty-input
        language: system
        files: ^(javascripts|desktop|mobile|common|scss|stylesheets)/.*\.scss$

      # Both of these check the project as a whole, so they take no filenames —
      # a type error or a failing test is rarely in the file that caused it.
      - id: ember-tsc
        name: type-check (glint)
        entry: pnpm lint:types
        language: system
        pass_filenames: false
        files: ^(javascripts|scripts|spec|types)/.*\.(ts|gts|d\.ts)$|^tsconfig\.json$

      # settings.yml and data/ are triggers because tests read them: the shipped
      # profile_link_fields default is fed through readLinkConfig, and the
      # Resolved Product Catalogue is what both sinks are generated from. A
      # change to either can break a test with no source file touched.
      # The same drift gate CI runs. It is cheap — two file reads, no network —
      # and catching a stale settings.yml before the commit exists is the whole
      # point: the generated region is where the shipped Mappings and the
      # catalogue they came from drift apart.
      - id: build-settings
        name: settings.yml matches the catalogue
        entry: pnpm build:settings --check
        language: system
        pass_filenames: false
        files: ^settings\.yml$|^data/resolved-products\.csv$|^scripts/(build-settings\.ts|lib/(build-settings|build-catalogue|catalogue-refresh)\.ts)$

      - id: vitest
        name: unit tests
        entry: pnpm test
        language: system
        pass_filenames: false
        files: ^(javascripts|migrations|scripts|spec|data)/|^(package\.json|vitest\.config\.mjs|settings\.yml)$
